# Explicit owner-assisted local provider check. Never included by the ordinary test stack.
services:
  db:
    image: mysql:8.4.11@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --transaction-isolation=REPEATABLE-READ
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${LIVE_ROOT_PASSWORD:?Owned allocation required}
      MYSQL_DATABASE: vtc_live_${LIVE_RUN:?Owned allocation required}
      MYSQL_USER: live_${LIVE_RUN:?Owned allocation required}
      MYSQL_PASSWORD: ${LIVE_DB_PASSWORD:?Owned allocation required}
    volumes: [live-data:/var/lib/mysql]
    networks: [database]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 20s
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: development
    init: true
    command: [sh, -c, "pnpm build:packages && pnpm --filter @vtc/api build && node scripts/external-identities-live-server.mjs"]
    environment:
      NODE_ENV: test
      TZ: UTC
      LIVE_RUN: ${LIVE_RUN:?Owned allocation required}
      LIVE_SHA: ${LIVE_SHA:?Candidate required}
      LIVE_PORT: ${LIVE_PORT:?Loopback port required}
      LIVE_ACK: owner-assisted-steam-only
      IDENTITY_SECRET: ${LIVE_IDENTITY_SECRET:?Owned allocation required}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: vtc_live_${LIVE_RUN:?Owned allocation required}
      MYSQL_USER: live_${LIVE_RUN:?Owned allocation required}
      MYSQL_PASSWORD: ${LIVE_DB_PASSWORD:?Owned allocation required}
    ports: ["127.0.0.1:${LIVE_PORT:?Loopback port required}:3000"]
    networks: [database, provider]
    depends_on:
      db: { condition: service_healthy }
networks:
  database: { internal: true }
  provider: {}
volumes:
  live-data:
