version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/test
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: node
        versions: ["< 24", ">= 25"]
      - dependency-name: mysql
        versions: ["< 8.4", ">= 8.5"]
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/test
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: node
        versions: ["< 24", ">= 25"]
      - dependency-name: mysql
        versions: ["< 8.4", ">= 8.5"]
# Root pnpm 12 hosted lockfile updating remains unverified; weekly manual coverage
# and the dated removal condition are documented in docs/development/review.md.
