          IFS=$'\t' read -r author_login is_cross_repository state head_sha base_sha base_ref <<< "$target"
          eligible=false
          if [[ "$author_login" != "dependabot[bot]" && "$is_cross_repository" == "false" && "$state" == "OPEN" && \
                "$base_ref" == "$DEFAULT_BRANCH" ]]; then
            eligible=true
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.eligible == 'true'
        with:
          ref: ${{ steps.target.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        id: review
