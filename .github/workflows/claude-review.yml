            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
            EXPECTED PR HEAD: ${{ steps.target.outputs.head_sha }}

            The repository owner explicitly requested an advisory re-review of the
            current pull request. The checkout is the trusted base commit. Apply
            the review criteria and comment limits in
            .github/workflows/claude-review.yml. Read AGENTS.md and CONCEPT.MD,
