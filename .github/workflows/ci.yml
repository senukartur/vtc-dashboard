name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.0
      - name: Run isolated quality suite
        timeout-minutes: 25
        run: node scripts/test-ci.mjs --probe unit
      - name: Upload safe structured result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci/quality.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  required:
    name: Required CI
    needs: [quality]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout aggregate evaluator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.0
      - name: Require explicit quality success
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          node --input-type=module -e 'import { requiredCi } from "./scripts/ci-result.mjs"; process.exitCode = requiredCi({ quality: process.env.QUALITY_RESULT });'
