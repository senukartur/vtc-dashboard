name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Each leg runs its own isolated stack; together the legs run every stage of the aggregate.
    # needs.quality.result is success only when every leg succeeds.
    name: Quality suite (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: core, group: core, shard: "" }
          - { name: integration, group: integration, shard: "" }
          - { name: persistence-recovery, group: persistence-recovery, shard: "" }
          - { name: e2e 1-4, group: e2e, shard: 1/4 }
          - { name: e2e 2-4, group: e2e, shard: 2/4 }
          - { name: e2e 3-4, group: e2e, shard: 3/4 }
          - { name: e2e 4-4, group: e2e, shard: 4/4 }
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Run isolated quality group
        timeout-minutes: 35
        env:
          QUALITY_GROUP: ${{ matrix.group }}
          QUALITY_SHARD: ${{ matrix.shard }}
        run: node scripts/test-ci.mjs --group "$QUALITY_GROUP" ${QUALITY_SHARD:+--shard "$QUALITY_SHARD"}
      - name: Upload safe structured result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-${{ matrix.group }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci/quality.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  deployment:
    name: Deployment rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: node deploy/development/test.mjs
  artifact:
    name: Production release artifact
    needs: [quality, deployment]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: node deploy/development/build-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: development-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .local/release/image.tar
            .local/release/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  required:
    name: Required CI
    needs: [quality, deployment, artifact]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout aggregate evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Require explicit quality success
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          ARTIFACT_RESULT: ${{ needs.artifact.result }}
        run: |
          node --input-type=module -e 'import { requiredCi } from "./scripts/ci-result.mjs"; process.exitCode = requiredCi({ quality: process.env.QUALITY_RESULT, deployment: process.env.DEPLOYMENT_RESULT, artifact: process.env.ARTIFACT_RESULT, event: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF });'
